name: Update BBC News

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bbc-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch official BBC News RSS
        run: python scripts/update_bbc_news.py

      - name: Publish updated feed
        run: |
          if git diff --quiet -- docs/bbc-news.json; then
            echo "BBC News is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bbc-news.json
          git commit -m "chore: refresh BBC News feed"
          git push
